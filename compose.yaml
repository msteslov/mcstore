services:
  api:
    build: .
    environment:
      MCSTORE_DATABASE_URL: postgresql+psycopg://mcstore:mcstore@postgres:5432/mcstore
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcstore
      POSTGRES_USER: mcstore
      POSTGRES_PASSWORD: mcstore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcstore"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
